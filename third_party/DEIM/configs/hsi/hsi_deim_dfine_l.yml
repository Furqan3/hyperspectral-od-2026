# [HSI] DEIM + D-FINE-L (HGNetv2-B4) from the Objects365+COCO checkpoint (57.3 COCO AP) on 16-band cubes.
__include__: [
  '../deim_dfine/deim_hgnetv2_l_coco.yml',
]

output_dir: ../../runs/deim_f0_dfine_l

num_classes: 18
remap_mscoco_category: False
eval_spatial_size: [512, 1024]

# D-FINE checkpoints are ReLU; DEIM's recipe would switch to SiLU and produce invalid boxes
DFINETransformer:
  activation: relu
  mlp_act: relu

HGNetv2:
  in_chans: 16
  pretrained: False
  use_lab: False   # B4/B5 checkpoints have no LearnableAffineBlock tensors (only S/M use_lab: True)

# LRs halved vs the COCO recipe (batch 4 instead of 32)
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.0000125
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.0001

warmup_iter: 600
epoches: 58        # L recipe: 58 / flat 29 / no-aug 8
flat_epoch: 29
no_aug_epoch: 8
checkpoint_freq: 12

train_dataloader:
  total_batch_size: 4
  num_workers: 6
  dataset:
    img_folder: ../../data/prepared/images/train
    ann_file: ../../data/prepared/coco/fold0_train.json
    transforms:
      ops:
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [512, 1024], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertTensorImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 29, 50]
        ops: ['RandomIoUCrop']
      mosaic_prob: 0.0
  collate_fn:
    base_size: 1024
    base_size_repeat: ~
    mixup_prob: 0.5
    mixup_epochs: [4, 29]
    stop_epoch: 50

val_dataloader:
  total_batch_size: 4
  num_workers: 6
  dataset:
    img_folder: ../../data/prepared/images/train
    ann_file: ../../data/prepared/coco/fold0_val.json
    transforms:
      ops:
        - {type: Resize, size: [512, 1024], }
        - {type: ConvertTensorImage, dtype: 'float32', scale: True}
