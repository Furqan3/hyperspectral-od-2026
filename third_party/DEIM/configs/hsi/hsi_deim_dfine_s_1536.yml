# [HSI] D-FINE-S at 768x1536 (3x the cube, same 1:2 aspect). Everything else as hsi_deim_dfine_s.yml.
__include__: ['./hsi_deim_dfine_s.yml']

output_dir: ../../runs/deim_f0_dfine_s_1536
eval_spatial_size: [768, 1536]

train_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      ops:
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [768, 1536], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertTensorImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    base_size: 1536

val_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [768, 1536], }
        - {type: ConvertTensorImage, dtype: 'float32', scale: True}
