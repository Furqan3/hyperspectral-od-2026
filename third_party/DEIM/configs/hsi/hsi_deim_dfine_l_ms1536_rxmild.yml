# edge detail, but detail/noise drops 21 -> 15 / 13, so this may well hurt; the run settles it.
__include__: ['./hsi_deim_dfine_l_ms1536.yml']
output_dir: ../../runs/deim_f0_l_rxmild
train_dataloader:
  dataset:
    img_folder: ../../data/prepared/images/train_rxmild
