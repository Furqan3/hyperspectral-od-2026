# [HSI] D-FINE-S with a finer box-edge distribution: reg_max 32 -> 64.
# D-FINE predicts each box edge as a distribution over reg_max bins; doubling the bins doubles the
# resolution of the refinement, which is exactly what mAP@[0.75:0.95] rewards on 15-25 px objects.
# The corner-head layers and the `project` buffer change shape, so those start random; the backbone,
# encoder and the rest of the decoder still load from the Objects365+COCO checkpoint.
__include__: ['./hsi_deim_dfine_s.yml']

output_dir: ../../runs/deim_f0_dfine_s_reg64

DFINETransformer:
  reg_max: 64
  reg_scale: 8     # D-FINE ties reg_scale to the bin count (4 for reg_max 32)
